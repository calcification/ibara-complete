name: Source-only checks (no commercial game data)
on:
  push:
  pull_request:
jobs:
  no-rom-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all Python source (syntax only)
        run: python -m compileall -q scripts research
      - name: PCSX2 PNACH group, CRC, and source-free checks
        run: python tests/test_pnach.py
      - name: Homebrew boot probe and synthetic ISO checks
        run: python tests/test_bootstrap.py
      - name: ISO patcher and bundled patch checks
        run: python tests/test_patcher.py
      - name: Source-only replay format and comparison checks
        run: python tools/replay/test_replay.py
      - name: Regenerate tiny patch profiles
        run: python scripts/build_pnach.py
      - name: EE hook builds and MIPS extractor (Debian 12 cross toolchain)
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo" --workdir /repo debian:12-slim sh -ec '
            apt-get update
            apt-get install -y --no-install-recommends gcc-mips-linux-gnu python3
            PYTHONDONTWRITEBYTECODE=1 python3 tests/test_ee_hooks.py
            PYTHONDONTWRITEBYTECODE=1 python3 tests/test_phase12.py
          '
      - name: Phase 5 standalone memory and trace tests
        run: python scripts/run_audits.py --selftest --out validation-output
      - name: Validate test manifest
        run: python scripts/check_manifest.py
      - name: Reject unapproved large or original game files
        run: python scripts/check_repository_safety.py
